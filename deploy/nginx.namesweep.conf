# NameSweep — nginx site (owner wires this up; see README "Deploy").
#
# The app is vanilla PHP with a front controller per entry point. The
# .htaccess-equivalent routing for nginx:
#   - /api/v1/*            -> public/api.php
#   - anything else        -> public/index.php (server-rendered pages)
#   - real files           -> served as-is
# The app's base-path logic (Layout::base() / Router) derives the mount
# point from SCRIPT_NAME, so this config also works under a subdirectory —
# just adjust `root` to the subpath, e.g. root /var/www/namesweep/public/.
#
# Replace the placeholders: server_name, root, fastcgi_pass.

server {
    listen 80;
    listen [::]:80;
    server_name namesweep.example.com;

    root /var/www/namesweep/public;
    index index.php;

    # Static assets — long-lived cache, no PHP.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: every /api/v1/* path (and bare /api.php) hits the API front
    # controller. api.php is not inside /assets, so it matches below.
    location ~ ^/api(/|$) {
        try_files $uri /api.php?$query_string;
    }

    # Front controller for the web UI.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM. Adjust the socket/address to your pool.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The app reads the Authorization header from PHP (Apache needed
        # SetEnvIf for this; nginx+fpm passes it through natively).
    }

    # Never serve dotfiles (e.g. .env if the docroot ever leaks).
    location ~ /\. {
        deny all;
    }
}
